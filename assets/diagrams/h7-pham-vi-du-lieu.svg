<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="880" viewBox="0 0 1180 880" font-family="'Segoe UI','Noto Sans',Arial,Helvetica,sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker><marker id="arrow-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker></defs>
<rect width="1180" height="880" fill="#ffffff"/>
<text x="590.0" y="44" text-anchor="middle" font-size="28.5" font-weight="600" fill="#0f172a">Phạm vi dữ liệu phù hợp và ranh giới pháp lý</text>
<rect x="30" y="90" width="360" height="560" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
<text x="210.0" y="198.9" text-anchor="middle" font-size="20.25" font-weight="500" fill="#052e16">Phù hợp về kỹ thuật và pháp</text>
<text x="210.0" y="222.1" text-anchor="middle" font-size="20.25" font-weight="500" fill="#052e16">lý</text>
<text x="210.0" y="248.4" text-anchor="middle" font-size="17.2" fill="#475569"></text>
<text x="210.0" y="270.5" text-anchor="middle" font-size="17.2" fill="#475569">Tài liệu phục vụ giảng dạy, đề</text>
<text x="210.0" y="292.6" text-anchor="middle" font-size="17.2" fill="#475569">cương, đề thi chưa công bố</text>
<text x="210.0" y="314.6" text-anchor="middle" font-size="17.2" fill="#475569"></text>
<text x="210.0" y="336.7" text-anchor="middle" font-size="17.2" fill="#475569">Kết quả học tập và dữ liệu cá nhân</text>
<text x="210.0" y="358.8" text-anchor="middle" font-size="17.2" fill="#475569">của người học</text>
<text x="210.0" y="380.9" text-anchor="middle" font-size="17.2" fill="#475569"></text>
<text x="210.0" y="403.0" text-anchor="middle" font-size="17.2" fill="#475569">Tài liệu nghiên cứu, bản thảo chưa</text>
<text x="210.0" y="425.0" text-anchor="middle" font-size="17.2" fill="#475569">công bố</text>
<text x="210.0" y="447.1" text-anchor="middle" font-size="17.2" fill="#475569"></text>
<text x="210.0" y="469.2" text-anchor="middle" font-size="17.2" fill="#475569">Trao đổi nghiệp vụ nội bộ không</text>
<text x="210.0" y="491.3" text-anchor="middle" font-size="17.2" fill="#475569">thuộc danh mục bí mật nhà nước</text>
<text x="210.0" y="513.4" text-anchor="middle" font-size="17.2" fill="#475569"></text>
<text x="210.0" y="535.4" text-anchor="middle" font-size="17.2" fill="#475569">Dữ liệu cần bảo vệ khi truyền qua</text>
<text x="210.0" y="557.5" text-anchor="middle" font-size="17.2" fill="#475569">hạ tầng công cộng</text>
<rect x="410" y="90" width="360" height="560" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
<text x="590.0" y="232.0" text-anchor="middle" font-size="20.25" font-weight="500" fill="#0f172a">Cần đánh giá và phê duyệt</text>
<text x="590.0" y="255.3" text-anchor="middle" font-size="20.25" font-weight="500" fill="#0f172a">riêng</text>
<text x="590.0" y="281.5" text-anchor="middle" font-size="17.2" fill="#475569"></text>
<text x="590.0" y="303.6" text-anchor="middle" font-size="17.2" fill="#475569">Thông tin nội bộ nhạy cảm chưa</text>
<text x="590.0" y="325.7" text-anchor="middle" font-size="17.2" fill="#475569">được phân loại</text>
<text x="590.0" y="347.8" text-anchor="middle" font-size="17.2" fill="#475569"></text>
<text x="590.0" y="369.8" text-anchor="middle" font-size="17.2" fill="#475569">Dữ liệu có yêu cầu lưu vết và kiểm</text>
<text x="590.0" y="391.9" text-anchor="middle" font-size="17.2" fill="#475569">toán tập trung</text>
<text x="590.0" y="414.0" text-anchor="middle" font-size="17.2" fill="#475569"></text>
<text x="590.0" y="436.1" text-anchor="middle" font-size="17.2" fill="#475569">Trường hợp cần khôi phục khóa tập</text>
<text x="590.0" y="458.2" text-anchor="middle" font-size="17.2" fill="#475569">trung (key escrow)</text>
<text x="590.0" y="480.2" text-anchor="middle" font-size="17.2" fill="#475569"></text>
<text x="590.0" y="502.3" text-anchor="middle" font-size="17.2" fill="#475569">Cần có quy chế sử dụng của đơn vị</text>
<text x="590.0" y="524.4" text-anchor="middle" font-size="17.2" fill="#475569">trước khi triển khai</text>
<rect x="790" y="90" width="360" height="560" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="970.0" y="209.9" text-anchor="middle" font-size="20.25" font-weight="500" fill="#450a0a">Không áp dụng khi chưa có cơ</text>
<text x="970.0" y="233.2" text-anchor="middle" font-size="20.25" font-weight="500" fill="#450a0a">sở pháp lý</text>
<text x="970.0" y="259.4" text-anchor="middle" font-size="17.2" fill="#475569"></text>
<text x="970.0" y="281.5" text-anchor="middle" font-size="17.2" fill="#475569">Thông tin thuộc danh mục bí mật</text>
<text x="970.0" y="303.6" text-anchor="middle" font-size="17.2" fill="#475569">nhà nước</text>
<text x="970.0" y="325.7" text-anchor="middle" font-size="17.2" fill="#475569"></text>
<text x="970.0" y="347.8" text-anchor="middle" font-size="17.2" fill="#475569">Việc truyền, nhận thông tin bí mật</text>
<text x="970.0" y="369.8" text-anchor="middle" font-size="17.2" fill="#475569">nhà nước qua mạng phải sử dụng sản</text>
<text x="970.0" y="391.9" text-anchor="middle" font-size="17.2" fill="#475569">phẩm mật mã và tuân thủ quy định</text>
<text x="970.0" y="414.0" text-anchor="middle" font-size="17.2" fill="#475569">về cơ yếu — Luật Bảo vệ bí mật nhà</text>
<text x="970.0" y="436.1" text-anchor="middle" font-size="17.2" fill="#475569">nước năm 2018 và Nghị định số</text>
<text x="970.0" y="458.2" text-anchor="middle" font-size="17.2" fill="#475569">26/2020/NĐ-CP.</text>
<text x="970.0" y="480.2" text-anchor="middle" font-size="17.2" fill="#475569"></text>
<text x="970.0" y="502.3" text-anchor="middle" font-size="17.2" fill="#475569">Secure Mail chưa được kiểm định và</text>
<text x="970.0" y="524.4" text-anchor="middle" font-size="17.2" fill="#475569">chưa được cấp phép cho mục đích</text>
<text x="970.0" y="546.5" text-anchor="middle" font-size="17.2" fill="#475569">này.</text>
<rect x="30" y="690" width="1120" height="110" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="590.0" y="730.4" text-anchor="middle" font-size="20.25" font-weight="500" fill="#475569">Hồ sơ này khẳng định năng lực kỹ thuật của giải pháp, không khẳng định tư cách pháp lý để bảo</text>
<text x="590.0" y="753.6" text-anchor="middle" font-size="20.25" font-weight="500" fill="#475569">vệ bí mật nhà nước. Ranh giới này được nêu ngay từ đầu, không phải là hạn chế được phát hiện về</text>
<text x="590.0" y="776.9" text-anchor="middle" font-size="20.25" font-weight="500" fill="#475569">sau.</text>
</svg>