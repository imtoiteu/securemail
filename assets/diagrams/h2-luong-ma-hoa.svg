<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1180" viewBox="0 0 1180 1180" font-family="'Segoe UI','Noto Sans',Arial,Helvetica,sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker><marker id="arrow-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker></defs>
<rect width="1180" height="1180" fill="#ffffff"/>
<text x="590.0" y="44" text-anchor="middle" font-size="28.5" font-weight="600" fill="#0f172a">Luồng xử lý một bức thư mã hóa (gửi và nhận)</text>
<rect x="40" y="100" width="300" height="170" rx="8" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="190.0" y="134.8" text-anchor="middle" font-size="20.25" font-weight="500" fill="#0f172a">1. Soạn thư trong khung</text>
<text x="190.0" y="158.0" text-anchor="middle" font-size="20.25" font-weight="500" fill="#0f172a">soạn thảo của Secure</text>
<text x="190.0" y="181.3" text-anchor="middle" font-size="20.25" font-weight="500" fill="#0f172a">Mail</text>
<text x="190.0" y="207.5" text-anchor="middle" font-size="17.2" fill="#475569">Bản rõ nằm trong iframe của</text>
<text x="190.0" y="229.6" text-anchor="middle" font-size="17.2" fill="#475569">tiện ích, không nằm trong</text>
<text x="190.0" y="251.7" text-anchor="middle" font-size="17.2" fill="#475569">DOM của Gmail</text>
<rect x="40" y="300" width="300" height="140" rx="8" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="190.0" y="354.0" text-anchor="middle" font-size="20.25" font-weight="500" fill="#0f172a">2. Chọn người nhận</text>
<text x="190.0" y="380.3" text-anchor="middle" font-size="17.2" fill="#475569">Tra khóa công khai trong</text>
<text x="190.0" y="402.4" text-anchor="middle" font-size="17.2" fill="#475569">chùm khóa cục bộ</text>
<rect x="40" y="470" width="300" height="160" rx="8" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="190.0" y="523.0" text-anchor="middle" font-size="20.25" font-weight="500" fill="#0f172a">3. Kiểm tra khóa</text>
<text x="190.0" y="549.3" text-anchor="middle" font-size="17.2" fill="#475569">Đối chiếu dấu vân tay; cảnh</text>
<text x="190.0" y="571.3" text-anchor="middle" font-size="17.2" fill="#475569">báo nếu khóa hết hạn hoặc đã</text>
<text x="190.0" y="593.4" text-anchor="middle" font-size="17.2" fill="#475569">bị thu hồi</text>
<rect x="40" y="660" width="300" height="210" rx="8" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.6"/>
<text x="190.0" y="727.0" text-anchor="middle" font-size="20.25" font-weight="600" fill="#0f172a">4. Mã hóa và ký số</text>
<text x="190.0" y="753.2" text-anchor="middle" font-size="17.2" fill="#475569">Khóa phiên AES-256, bọc bằng</text>
<text x="190.0" y="775.3" text-anchor="middle" font-size="17.2" fill="#475569">khóa công khai RSA-4096 của</text>
<text x="190.0" y="797.4" text-anchor="middle" font-size="17.2" fill="#475569">từng người nhận; ký bằng</text>
<text x="190.0" y="819.5" text-anchor="middle" font-size="17.2" fill="#475569">khóa riêng tư người gửi</text>
<rect x="40" y="900" width="300" height="150" rx="8" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="190.0" y="959.0" text-anchor="middle" font-size="20.25" font-weight="500" fill="#0f172a">5. Giao cho Gmail</text>
<text x="190.0" y="985.3" text-anchor="middle" font-size="17.2" fill="#475569">Chỉ khối bản mã ASCII rời</text>
<text x="190.0" y="1007.4" text-anchor="middle" font-size="17.2" fill="#475569">khỏi máy trạm</text>
<rect x="400" y="400" width="380" height="400" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="590.0" y="528.3" text-anchor="middle" font-size="20.25" font-weight="500" fill="#450a0a">Trên đường truyền và tại máy</text>
<text x="590.0" y="551.5" text-anchor="middle" font-size="20.25" font-weight="500" fill="#450a0a">chủ Google</text>
<text x="590.0" y="577.8" text-anchor="middle" font-size="17.2" fill="#475569">Thấy được: người gửi, người nhận,</text>
<text x="590.0" y="599.8" text-anchor="middle" font-size="17.2" fill="#475569">thời gian, kích thước, tiêu đề thư —</text>
<text x="590.0" y="621.9" text-anchor="middle" font-size="17.2" fill="#475569">tức là siêu dữ liệu.</text>
<text x="590.0" y="644.0" text-anchor="middle" font-size="17.2" fill="#475569"></text>
<text x="590.0" y="666.1" text-anchor="middle" font-size="17.2" fill="#475569">Không thấy được: nội dung thư và tệp</text>
<text x="590.0" y="688.2" text-anchor="middle" font-size="17.2" fill="#475569">đính kèm.</text>
<rect x="840" y="100" width="300" height="150" rx="8" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="990.0" y="159.0" text-anchor="middle" font-size="20.25" font-weight="500" fill="#0f172a">6. Nhận thư</text>
<text x="990.0" y="185.3" text-anchor="middle" font-size="17.2" fill="#475569">Nhận diện khối OpenPGP trong</text>
<text x="990.0" y="207.4" text-anchor="middle" font-size="17.2" fill="#475569">thư</text>
<rect x="840" y="280" width="300" height="150" rx="8" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="990.0" y="339.0" text-anchor="middle" font-size="20.25" font-weight="500" fill="#0f172a">7. Nhập cụm mật khẩu</text>
<text x="990.0" y="365.3" text-anchor="middle" font-size="17.2" fill="#475569">Hộp thoại của tiện ích, cách</text>
<text x="990.0" y="387.4" text-anchor="middle" font-size="17.2" fill="#475569">ly khỏi trang Gmail</text>
<rect x="840" y="460" width="300" height="210" rx="8" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.6"/>
<text x="990.0" y="526.4" text-anchor="middle" font-size="20.25" font-weight="600" fill="#0f172a">8. Giải mã và xác minh</text>
<text x="990.0" y="549.6" text-anchor="middle" font-size="20.25" font-weight="600" fill="#0f172a">chữ ký</text>
<text x="990.0" y="575.9" text-anchor="middle" font-size="17.2" fill="#475569">Mở khóa riêng tư → khôi phục</text>
<text x="990.0" y="598.0" text-anchor="middle" font-size="17.2" fill="#475569">khóa phiên → giải mã → kiểm</text>
<text x="990.0" y="620.0" text-anchor="middle" font-size="17.2" fill="#475569">tra toàn vẹn và chữ ký</text>
<rect x="840" y="700" width="300" height="170" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
<text x="990.0" y="746.4" text-anchor="middle" font-size="20.25" font-weight="500" fill="#052e16">9. Hiển thị trong khung</text>
<text x="990.0" y="769.6" text-anchor="middle" font-size="20.25" font-weight="500" fill="#052e16">cách ly</text>
<text x="990.0" y="795.9" text-anchor="middle" font-size="17.2" fill="#475569">Kèm trạng thái chữ ký: hợp</text>
<text x="990.0" y="818.0" text-anchor="middle" font-size="17.2" fill="#475569">lệ, không hợp lệ, hoặc không</text>
<text x="990.0" y="840.0" text-anchor="middle" font-size="17.2" fill="#475569">có</text>
<rect x="40" y="1080" width="1100" height="80" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="590.0" y="1117.0" text-anchor="middle" font-size="20.25" font-weight="500" fill="#475569">Bước 8 thất bại nếu bản mã bị sửa dù chỉ một ký tự: cơ chế kiểm tra toàn vẹn của OpenPGP từ</text>
<text x="590.0" y="1140.2" text-anchor="middle" font-size="20.25" font-weight="500" fill="#475569">chối bản mã thay vì trả về bản rõ sai. Xem Phụ lục kỹ thuật, phép thử D.</text>
<line x1="190.0" y1="270" x2="190.0" y2="300" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="190.0" y1="440" x2="190.0" y2="470" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="190.0" y1="630" x2="190.0" y2="660" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="190.0" y1="870" x2="190.0" y2="900" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="190.0" y1="900" x2="590.0" y2="800" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="356.5" y="829.3" width="66.9" height="20.7" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="390.0" y="844.0" text-anchor="middle" font-size="17.2" fill="#334155">bản mã</text>
<line x1="590.0" y1="400" x2="990.0" y2="250" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="756.5" y="304.3" width="66.9" height="20.7" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="790.0" y="319.0" text-anchor="middle" font-size="17.2" fill="#334155">bản mã</text>
<line x1="990.0" y1="250" x2="990.0" y2="280" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="990.0" y1="430" x2="990.0" y2="460" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="990.0" y1="670" x2="990.0" y2="700" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/>
</svg>