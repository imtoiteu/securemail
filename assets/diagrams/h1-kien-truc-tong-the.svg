<text x="970.0" y="725.1" text-anchor="middle" font-size="20.25" font-weight="500" fill="#0f172a">Người nhận</text>
<text x="970.0" y="751.3" text-anchor="middle" font-size="17.2" fill="#475569">Secure Mail hoặc GnuPG</text>
<rect x="30" y="930" width="1120" height="90" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="590.0" y="972.0" text-anchor="middle" font-size="20.25" font-weight="500" fill="#475569">Bản rõ không bao giờ rời khỏi ranh giới tin cậy: việc mã hóa xảy ra trước khi dữ liệu được trao</text>
<text x="590.0" y="995.2" text-anchor="middle" font-size="20.25" font-weight="500" fill="#475569">cho Gmail API. Khóa riêng tư không bao giờ rời khỏi máy trạm.</text>
