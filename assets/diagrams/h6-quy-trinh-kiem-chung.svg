<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="900" viewBox="0 0 1180 900" font-family="'Segoe UI','Noto Sans',Arial,Helvetica,sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker><marker id="arrow-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker></defs>
<rect width="1180" height="900" fill="#ffffff"/>
<text x="590.0" y="44" text-anchor="middle" font-size="28.5" font-weight="600" fill="#0f172a">Quy trình xây dựng và kiểm chứng một bản phát hành</text>
<rect x="30" y="300" width="190" height="150" rx="8" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="125.0" y="348.0" text-anchor="middle" font-size="20.25" font-weight="500" fill="#0f172a">1. Mã nguồn</text>
<text x="125.0" y="374.3" text-anchor="middle" font-size="17.2" fill="#475569">Git, lịch sử đầy</text>
<text x="125.0" y="396.3" text-anchor="middle" font-size="17.2" fill="#475569">đủ, không chứa bí</text>
<text x="125.0" y="418.4" text-anchor="middle" font-size="17.2" fill="#475569">mật</text>
<rect x="270" y="110" width="220" height="150" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
<text x="380.0" y="157.4" text-anchor="middle" font-size="20.25" font-weight="500" fill="#052e16">2. Kiểm thử đơn</text>
<text x="380.0" y="180.7" text-anchor="middle" font-size="20.25" font-weight="500" fill="#052e16">vị</text>
<text x="380.0" y="206.9" text-anchor="middle" font-size="17.2" fill="#475569">449/449 đạt</text>
<text x="380.0" y="229.0" text-anchor="middle" font-size="17.2" fill="#475569">(bản máy tính)</text>
<rect x="270" y="300" width="220" height="150" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
<text x="380.0" y="347.4" text-anchor="middle" font-size="20.25" font-weight="500" fill="#052e16">3. Kiểm thử di</text>
<text x="380.0" y="370.7" text-anchor="middle" font-size="20.25" font-weight="500" fill="#052e16">động</text>
<text x="380.0" y="396.9" text-anchor="middle" font-size="17.2" fill="#475569">68/68 đạt</text>
<text x="380.0" y="419.0" text-anchor="middle" font-size="17.2" fill="#475569">(cầu RPC và lõi)</text>
<rect x="270" y="490" width="220" height="150" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
<text x="380.0" y="537.4" text-anchor="middle" font-size="20.25" font-weight="500" fill="#052e16">4. Kiểm toán bản</text>
<text x="380.0" y="560.7" text-anchor="middle" font-size="20.25" font-weight="500" fill="#052e16">dịch</text>
<text x="380.0" y="586.9" text-anchor="middle" font-size="17.2" fill="#475569">586/586 khóa</text>
<text x="380.0" y="609.0" text-anchor="middle" font-size="17.2" fill="#475569">0 lỗi chặn</text>
<rect x="540" y="300" width="220" height="150" rx="8" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.6"/>
<text x="650.0" y="347.4" text-anchor="middle" font-size="20.25" font-weight="600" fill="#0f172a">5. Biên dịch bản</text>
<text x="650.0" y="370.7" text-anchor="middle" font-size="20.25" font-weight="600" fill="#0f172a">phát hành</text>
<text x="650.0" y="396.9" text-anchor="middle" font-size="17.2" fill="#475569">grunt prod</text>
<text x="650.0" y="419.0" text-anchor="middle" font-size="17.2" fill="#475569">webpack, rút gọn mã</text>
<rect x="810" y="110" width="240" height="160" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
<text x="930.0" y="151.4" text-anchor="middle" font-size="20.25" font-weight="500" fill="#052e16">6. Kiểm toán bề mặt</text>
<text x="930.0" y="174.6" text-anchor="middle" font-size="20.25" font-weight="500" fill="#052e16">mạng</text>
<text x="930.0" y="200.9" text-anchor="middle" font-size="17.2" fill="#475569">verify-no-external-endpoints.sh</text>
<text x="930.0" y="223.0" text-anchor="middle" font-size="17.2" fill="#475569">4/4 điểm cuối đã gỡ:</text>
<text x="930.0" y="245.0" text-anchor="middle" font-size="17.2" fill="#475569">vắng mặt</text>
<rect x="810" y="310" width="240" height="160" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
<text x="930.0" y="351.4" text-anchor="middle" font-size="20.25" font-weight="500" fill="#052e16">7. Kiểm chứng liên</text>
<text x="930.0" y="374.6" text-anchor="middle" font-size="20.25" font-weight="500" fill="#052e16">thông</text>
<text x="930.0" y="400.9" text-anchor="middle" font-size="17.2" fill="#475569">interop-gnupg.mjs</text>
<text x="930.0" y="423.0" text-anchor="middle" font-size="17.2" fill="#475569">8/8 phép thử đạt với</text>
<text x="930.0" y="445.0" text-anchor="middle" font-size="17.2" fill="#475569">GnuPG 2.4.4</text>
<rect x="810" y="510" width="240" height="160" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
<text x="930.0" y="563.0" text-anchor="middle" font-size="20.25" font-weight="500" fill="#052e16">8. Đo hiệu năng</text>
<text x="930.0" y="589.3" text-anchor="middle" font-size="17.2" fill="#475569">benchmark-crypto.mjs</text>
<text x="930.0" y="611.3" text-anchor="middle" font-size="17.2" fill="#475569">Số liệu tại Phụ lục kỹ</text>
<text x="930.0" y="633.4" text-anchor="middle" font-size="17.2" fill="#475569">thuật</text>
<rect x="30" y="550" width="190" height="170" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
<text x="125.0" y="596.4" text-anchor="middle" font-size="20.25" font-weight="500" fill="#0f172a">9. Đóng gói và</text>
<text x="125.0" y="619.6" text-anchor="middle" font-size="20.25" font-weight="500" fill="#0f172a">niêm phong</text>
<text x="125.0" y="645.9" text-anchor="middle" font-size="17.2" fill="#475569">Tệp .zip kèm</text>
<text x="125.0" y="668.0" text-anchor="middle" font-size="17.2" fill="#475569">SHA-256, mã định</text>
<text x="125.0" y="690.0" text-anchor="middle" font-size="17.2" fill="#475569">danh cố định</text>
<rect x="30" y="770" width="1120" height="100" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="590.0" y="817.0" text-anchor="middle" font-size="20.25" font-weight="500" fill="#475569">Các bước 6, 7 và 8 đều là kịch bản chạy được, kết quả kèm trong hồ sơ. Người thẩm định chạy lại</text>
<text x="590.0" y="840.2" text-anchor="middle" font-size="20.25" font-weight="500" fill="#475569">được trên chính bản phát hành để tự kiểm chứng, không phải tin vào lời khẳng định.</text>
<line x1="220" y1="375.0" x2="270" y2="185.0" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="220" y1="375.0" x2="270" y2="375.0" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="220" y1="375.0" x2="270" y2="565.0" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="380.0" y1="260" x2="650.0" y2="300" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="490" y1="375.0" x2="540" y2="375.0" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="380.0" y1="490" x2="650.0" y2="450" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="760" y1="375.0" x2="810" y2="190.0" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="760" y1="375.0" x2="810" y2="390.0" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="650.0" y1="450" x2="930.0" y2="510" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="810" y1="590.0" x2="220" y2="635.0" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="457.8" y="591.8" width="114.4" height="20.7" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="515.0" y="606.5" text-anchor="middle" font-size="17.2" fill="#334155">đạt toàn bộ</text>
</svg>