<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1020" viewBox="0 0 1180 1020" font-family="'Segoe UI','Noto Sans',Arial,Helvetica,sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker><marker id="arrow-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker></defs>
<rect width="1180" height="1020" fill="#ffffff"/>
<text x="590.0" y="44" text-anchor="middle" font-size="28.5" font-weight="600" fill="#0f172a">Kiến trúc phiên bản di động: tái sử dụng nguyên vẹn lõi mật mã đã kiểm chứng</text>
<rect x="30" y="90" width="740" height="720" rx="12" fill="none" stroke="#1d4ed8" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="44" y="117.5" font-size="19.5" font-weight="600" fill="#1d4ed8">Ứng dụng Android</text>
<rect x="60" y="150" width="300" height="160" rx="8" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="210.0" y="191.4" text-anchor="middle" font-size="20.25" font-weight="500" fill="#0f172a">Giao diện gốc React</text>
<text x="210.0" y="214.6" text-anchor="middle" font-size="20.25" font-weight="500" fill="#0f172a">Native</text>
<text x="210.0" y="240.9" text-anchor="middle" font-size="17.2" fill="#475569">Thiết kế cho màn hình cảm</text>
<text x="210.0" y="263.0" text-anchor="middle" font-size="17.2" fill="#475569">ứng, không thu nhỏ giao diện</text>
<text x="210.0" y="285.0" text-anchor="middle" font-size="17.2" fill="#475569">máy tính</text>
<rect x="60" y="350" width="300" height="180" rx="8" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.6"/>
<text x="210.0" y="402.0" text-anchor="middle" font-size="20.25" font-weight="600" fill="#0f172a">Cầu RPC có kiểu</text>
<text x="210.0" y="428.2" text-anchor="middle" font-size="17.2" fill="#475569">Gói tin {id, method, params}</text>
<text x="210.0" y="450.3" text-anchor="middle" font-size="17.2" fill="#475569">→ {id, ok, result | error}</text>
<text x="210.0" y="472.4" text-anchor="middle" font-size="17.2" fill="#475569">Có timeout và lan truyền lỗi</text>
<text x="210.0" y="494.5" text-anchor="middle" font-size="17.2" fill="#475569">sập</text>
<rect x="60" y="570" width="300" height="190" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
<text x="210.0" y="627.0" text-anchor="middle" font-size="20.25" font-weight="500" fill="#0f172a">Kho dữ liệu mã hóa</text>
<text x="210.0" y="653.2" text-anchor="middle" font-size="17.2" fill="#475569">DEK bọc bằng Android</text>
<text x="210.0" y="675.3" text-anchor="middle" font-size="17.2" fill="#475569">Keystore, dữ liệu</text>
<text x="210.0" y="697.4" text-anchor="middle" font-size="17.2" fill="#475569">AES-256-GCM, tệp lưu dạng</text>
<text x="210.0" y="719.5" text-anchor="middle" font-size="17.2" fill="#475569">khối mờ</text>
<rect x="420" y="300" width="320" height="230" rx="8" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.6"/>
<text x="580.0" y="365.9" text-anchor="middle" font-size="20.25" font-weight="600" fill="#0f172a">WebView ẩn — &quot;core host&quot;</text>
<text x="580.0" y="392.2" text-anchor="middle" font-size="17.2" fill="#475569">Nạp nguyên vẹn</text>
<text x="580.0" y="414.3" text-anchor="middle" font-size="17.2" fill="#475569">mailvelope/src/modules/*</text>
<text x="580.0" y="436.3" text-anchor="middle" font-size="17.2" fill="#475569">OpenPGP.js 5.11.3, DOMPurify</text>
<text x="580.0" y="458.4" text-anchor="middle" font-size="17.2" fill="#475569">Chromium: cùng họ engine với</text>
<text x="580.0" y="480.5" text-anchor="middle" font-size="17.2" fill="#475569">bản máy tính</text>
<rect x="420" y="570" width="320" height="190" rx="8" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="580.0" y="626.4" text-anchor="middle" font-size="20.25" font-weight="500" fill="#0f172a">Lớp đệm thay thế API của</text>
<text x="580.0" y="649.6" text-anchor="middle" font-size="20.25" font-weight="500" fill="#0f172a">Chrome</text>
<text x="580.0" y="675.9" text-anchor="middle" font-size="17.2" fill="#475569">chrome.storage, chrome.alarms,</text>
<text x="580.0" y="698.0" text-anchor="middle" font-size="17.2" fill="#475569">chrome.identity chuyển tiếp</text>
<text x="580.0" y="720.0" text-anchor="middle" font-size="17.2" fill="#475569">qua cầu RPC</text>
<rect x="820" y="150" width="320" height="220" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="980.0" y="199.3" text-anchor="middle" font-size="20.25" font-weight="500" fill="#334155">Tiện ích trên máy tính</text>
<text x="980.0" y="222.6" text-anchor="middle" font-size="20.25" font-weight="500" fill="#334155">(chỉ đọc)</text>
<text x="980.0" y="248.8" text-anchor="middle" font-size="17.2" fill="#475569">Không sửa một dòng nào. Kiểm</text>
<text x="980.0" y="270.9" text-anchor="middle" font-size="17.2" fill="#475569">chứng bằng</text>
<text x="980.0" y="293.0" text-anchor="middle" font-size="17.2" fill="#475569">verify-desktop-untouched.sh:</text>
<text x="980.0" y="315.0" text-anchor="middle" font-size="17.2" fill="#475569">so khớp mã băm SHA-256 của 161</text>
<text x="980.0" y="337.1" text-anchor="middle" font-size="17.2" fill="#475569">tệp</text>
<rect x="820" y="420" width="320" height="220" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
<text x="980.0" y="480.3" text-anchor="middle" font-size="20.25" font-weight="500" fill="#052e16">Phép thử đối chứng và liên</text>
<text x="980.0" y="503.6" text-anchor="middle" font-size="20.25" font-weight="500" fill="#052e16">thông</text>
<text x="980.0" y="529.8" text-anchor="middle" font-size="17.2" fill="#475569">68/68 phép thử đạt. Bản mã</text>
<text x="980.0" y="551.9" text-anchor="middle" font-size="17.2" fill="#475569">sinh trên di động giải mã được</text>
<text x="980.0" y="574.0" text-anchor="middle" font-size="17.2" fill="#475569">bằng thư viện độc lập, và</text>
<text x="980.0" y="596.1" text-anchor="middle" font-size="17.2" fill="#475569">ngược lại</text>
<rect x="30" y="840" width="1120" height="110" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="590.0" y="880.4" text-anchor="middle" font-size="20.25" font-weight="500" fill="#475569">Lý do dùng WebView thay vì chạy thư viện mật mã trên engine JavaScript của React Native: giữ</text>
<text x="590.0" y="903.6" text-anchor="middle" font-size="20.25" font-weight="500" fill="#475569">nguyên hành vi mật mã đã được kiểm chứng, tránh phải tự bổ sung Web Crypto, Web Streams và</text>
<text x="590.0" y="926.9" text-anchor="middle" font-size="20.25" font-weight="500" fill="#475569">TextEncoder — những thứ không xác nhận đúng được nếu không có thiết bị thật.</text>
<line x1="210.0" y1="310" x2="210.0" y2="350" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="360" y1="440.0" x2="420" y2="415.0" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="318.6" y="406.8" width="142.8" height="20.7" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="390.0" y="421.5" text-anchor="middle" font-size="17.2" fill="#334155">gọi hàm mật mã</text>
<line x1="580.0" y1="530" x2="580.0" y2="570" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="420" y1="665.0" x2="360" y2="665.0" stroke="#334155" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<rect x="351.8" y="644.3" width="76.4" height="20.7" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="390.0" y="659.0" text-anchor="middle" font-size="17.2" fill="#334155">lưu trữ</text>
<line x1="210.0" y1="530" x2="210.0" y2="570" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="820" y1="260.0" x2="740" y2="415.0" stroke="#334155" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<rect x="694.4" y="316.8" width="171.3" height="20.7" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="780.0" y="331.5" text-anchor="middle" font-size="17.2" fill="#334155">mã nguồn dùng lại</text>
<line x1="820" y1="530.0" x2="740" y2="415.0" stroke="#334155" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<rect x="727.6" y="451.8" width="104.9" height="20.7" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="780.0" y="466.5" text-anchor="middle" font-size="17.2" fill="#334155">kiểm chứng</text>
</svg>