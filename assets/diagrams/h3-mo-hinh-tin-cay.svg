<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1030" viewBox="0 0 1180 1030" font-family="'Segoe UI','Noto Sans',Arial,Helvetica,sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker><marker id="arrow-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker></defs>
<rect width="1180" height="1030" fill="#ffffff"/>
<text x="590.0" y="44" text-anchor="middle" font-size="28.5" font-weight="600" fill="#0f172a">Hai mô hình phân phối khóa công khai</text>
<rect x="30" y="90" width="1120" height="320" rx="12" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="44" y="117.5" font-size="19.5" font-weight="600" fill="#b91c1c">A. Mô hình mặc định của Mailvelope: tra cứu máy chủ khóa công cộng</text>
<rect x="30" y="450" width="1120" height="320" rx="12" fill="none" stroke="#1d4ed8" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="44" y="477.5" font-size="19.5" font-weight="600" fill="#1d4ed8">B. Mô hình khép kín của Secure Mail (cấu hình mặc định)</text>
<rect x="70" y="160" width="220" height="100" rx="24" fill="#ffffff" stroke="#0f172a" stroke-width="1.6"/>
<text x="180.0" y="218.6" text-anchor="middle" font-size="20.25" font-weight="500" fill="#0f172a">Người dùng A</text>
<rect x="460" y="140" width="260" height="161" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="590.0" y="170.3" text-anchor="middle" font-size="20.25" font-weight="500" fill="#450a0a">Máy chủ khóa công</text>
<text x="590.0" y="193.5" text-anchor="middle" font-size="20.25" font-weight="500" fill="#450a0a">cộng đặt ở nước</text>
<text x="590.0" y="216.8" text-anchor="middle" font-size="20.25" font-weight="500" fill="#450a0a">ngoài</text>
<text x="590.0" y="243.0" text-anchor="middle" font-size="17.2" fill="#475569">keys.mailvelope.com</text>
<text x="590.0" y="265.1" text-anchor="middle" font-size="17.2" fill="#475569">keys.openpgp.org</text>
<text x="590.0" y="287.2" text-anchor="middle" font-size="17.2" fill="#475569">Web Key Directory</text>
<rect x="890" y="160" width="220" height="100" rx="24" fill="#ffffff" stroke="#0f172a" stroke-width="1.6"/>
<text x="1000.0" y="218.6" text-anchor="middle" font-size="20.25" font-weight="500" fill="#0f172a">Người dùng B</text>
<rect x="70" y="300" width="1040" height="89" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="590.0" y="329.9" text-anchor="middle" font-size="20.25" font-weight="500" fill="#475569">Mỗi lần tra cứu để lộ &quot;ai đang chuẩn bị liên lạc với ai&quot; cho một bên thứ ba ngoài tầm</text>
<text x="590.0" y="353.1" text-anchor="middle" font-size="20.25" font-weight="500" fill="#475569">kiểm soát. Tin cậy theo kiểu TOFU: không có thẩm quyền nào xác nhận khóa đó thực sự</text>
<text x="590.0" y="376.4" text-anchor="middle" font-size="20.25" font-weight="500" fill="#475569">thuộc về ai.</text>
<rect x="70" y="520" width="220" height="100" rx="24" fill="#ffffff" stroke="#0f172a" stroke-width="1.6"/>
<text x="180.0" y="578.6" text-anchor="middle" font-size="20.25" font-weight="500" fill="#0f172a">Người dùng A</text>
<rect x="460" y="500" width="260" height="160" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
<text x="590.0" y="541.4" text-anchor="middle" font-size="20.25" font-weight="500" fill="#052e16">Quản trị viên khóa</text>
<text x="590.0" y="564.6" text-anchor="middle" font-size="20.25" font-weight="500" fill="#052e16">của đơn vị</text>
<text x="590.0" y="590.9" text-anchor="middle" font-size="17.2" fill="#475569">Giữ danh mục khóa công</text>
<text x="590.0" y="613.0" text-anchor="middle" font-size="17.2" fill="#475569">khai và dấu vân tay đã</text>
<text x="590.0" y="635.0" text-anchor="middle" font-size="17.2" fill="#475569">đối chiếu</text>
<rect x="890" y="520" width="220" height="100" rx="24" fill="#ffffff" stroke="#0f172a" stroke-width="1.6"/>
<text x="1000.0" y="578.6" text-anchor="middle" font-size="20.25" font-weight="500" fill="#0f172a">Người dùng B</text>
<rect x="70" y="665" width="1040" height="90" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="590.0" y="707.0" text-anchor="middle" font-size="20.25" font-weight="500" fill="#475569">Khóa công khai và dấu vân tay được phân phát qua kênh nội bộ đã xác thực. Không có truy</text>
<text x="590.0" y="730.2" text-anchor="middle" font-size="20.25" font-weight="500" fill="#475569">vấn nào rời khỏi đơn vị. Trách nhiệm xác nhận danh tính thuộc về tổ chức.</text>
<rect x="30" y="800" width="1120" height="190" rx="8" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="590.0" y="845.9" text-anchor="middle" font-size="20.25" font-weight="500" fill="#0f172a">Cấu hình kiểm chứng được trong src/res/defaults.json</text>
<text x="590.0" y="872.2" text-anchor="middle" font-size="17.2" fill="#475569">mvelo_tofu_lookup = false • oks_lookup = false • wkd_lookup = false • autocrypt_lookup = false • tự động tải</text>
<text x="590.0" y="894.3" text-anchor="middle" font-size="17.2" fill="#475569">khóa lên máy chủ = tắt</text>
<text x="590.0" y="916.3" text-anchor="middle" font-size="17.2" fill="#475569"></text>
<text x="590.0" y="938.4" text-anchor="middle" font-size="17.2" fill="#475569">Cả bốn cơ chế tra cứu bên ngoài đều tắt mặc định. Quản trị viên vẫn bật lại được nếu đơn vị tự vận hành máy chủ</text>
<text x="590.0" y="960.5" text-anchor="middle" font-size="17.2" fill="#475569">khóa nội bộ.</text>
<line x1="290" y1="210.0" x2="460" y2="220.5" stroke="#b91c1c" stroke-width="1.7" marker-end="url(#arrow-r)"/>
<rect x="284.6" y="194.6" width="180.8" height="20.7" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="375.0" y="209.2" text-anchor="middle" font-size="17.2" fill="#b91c1c">tra cứu khóa của B</text>
<line x1="890" y1="210.0" x2="720" y2="220.5" stroke="#b91c1c" stroke-width="1.7" marker-end="url(#arrow-r)"/>
<rect x="743.1" y="194.6" width="123.9" height="20.7" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="805.0" y="209.2" text-anchor="middle" font-size="17.2" fill="#b91c1c">tải khóa lên</text>
<line x1="290" y1="570.0" x2="460" y2="580.0" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="279.9" y="554.3" width="190.3" height="20.7" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="375.0" y="569.0" text-anchor="middle" font-size="17.2" fill="#334155">nhận khóa công khai</text>
<line x1="890" y1="570.0" x2="720" y2="580.0" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="714.6" y="554.3" width="180.8" height="20.7" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="805.0" y="569.0" text-anchor="middle" font-size="17.2" fill="#334155">nộp khóa công khai</text>
</svg>